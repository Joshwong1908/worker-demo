<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowAI · AI 工作流平台</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">⚡ FlowAI</div>
    <nav>
      <button class="tab active" data-tab="chat">💬 聊天</button>
      <button class="tab" data-tab="workflows">🔗 工作流</button>
    </nav>
    <div class="storage-badge" id="storageBadge" title="存储模式">检查存储中…</div>
  </header>

  <!-- ============ 聊天页 ============ -->
  <main id="page-chat" class="page active">
    <aside class="session-panel">
      <button class="btn new-session" id="newSessionBtn">＋ 新建会话</button>
      <div class="session-list" id="sessionList"></div>
    </aside>
    <section class="chat-area">
      <div class="chat-head">
        <select id="modelSelect" class="model-select"></select>
      </div>
      <div class="messages" id="messages">
        <div class="empty-hint">
          <h2>开始对话</h2>
          <p>多会话管理 · 流式输出 · 模型可切换</p>
        </div>
      </div>
      <div class="input-bar">
        <textarea id="chatInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn send-btn" id="sendBtn">发送</button>
      </div>
    </section>
  </main>

  <!-- ============ 工作流页 ============ -->
  <main id="page-workflows" class="page">
    <aside class="wf-panel">
      <button class="btn new-session" id="newWfBtn">＋ 新建工作流</button>
      <div class="session-list" id="wfList"></div>
    </aside>
    <section class="wf-editor" id="wfEditor">
      <div class="empty-hint"><h2>选择或新建工作流</h2><p>提示词模板 + 变量 + 模型 = 可复用的 AI 流程</p></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
